name: Test Project
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Test Code
              uses: actions/checkout@v3
            - name: Install NodeJS
              uses: actions/setup-node@tv3
              with: 
                node-version: 20.11.0
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test